<form #registerFor="ngForm" (ngSubmit)="register()" autocomplete="off">
    <h2 class="text-center text-primary">Sign up</h2>
    <hr>
    <!-- <div class="mb-3">
            <label class="pb-2">Who is your favorite user?</label>
            <select class="form-select">
                <option *ngFor="let user of usersFromHomeComponent" [value]="user.userName">
                    {{user.userName}}
                </option>
            </select>
        </div> -->
    <div class="mb-3">
        <input type="text" class="form-control" name="username" [(ngModel)]="model.username" placeholder="Username">
    </div>
    <div class="mb-3">
        <input type="text" class="form-control" name="password" [(ngModel)]="model.password" placeholder="Password"
            type="password">
    </div>
    <div class="text-center">
        <button class="btn btn-success btn-lg me-2" type="submit">Register</button>
        <button (click)="cancel()" class="btn btn-default btn-lg" type="button">Cancel</button>
    </div>

</form>
